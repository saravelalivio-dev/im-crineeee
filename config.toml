# Pink theme applied to Streamlit's own chrome, so the widgets match the CSS.
# Pinning base="light" matters: the app's palette was validated against a light
# surface, and letting the viewer's OS force dark mode would invalidate it.

[theme]
base = "light"
primaryColor = "#D81B74"              # rose - buttons, sliders, focus rings
backgroundColor = "#FFF7FB"           # page blush
secondaryBackgroundColor = "#FFE4EF"  # sidebar, widget wells
textColor = "#4A2C3A"                 # warm plum-brown ink
font = "sans serif"

[server]
maxUploadSize = 50                    # iMODS exports and PDB complexes

[browser]
gatherUsageStats = false
